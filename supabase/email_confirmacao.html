<!--
  samyest.mind — email de confirmação de cadastro

  ONDE COLAR
    Supabase -> Authentication -> Emails -> Templates -> "Confirm sign up"
    Assunto sugerido: Confirme seu email — samyest.mind

  POR QUE O HTML É "ANTIGO"
    Cliente de email não é navegador. Gmail e Outlook descartam <style>, flexbox
    e grid, então o layout vai em tabelas com estilo inline, do jeito que se
    fazia em 2005. Feio de ler, mas é o que chega inteiro na caixa de entrada.

    O selo do logo é um quadrado colorido com a letra dentro, não uma imagem:
    o Gmail bloqueia imagens externas por padrão, e um logo que só aparece
    depois de "exibir imagens" não é um logo.

  A VARIÁVEL
    {{ .ConfirmationURL }} é substituída pelo Supabase na hora do envio.
    Sem ela o email não confirma nada.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E9EDF1;margin:0;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

        <!-- Marca -->
        <tr>
          <td align="center" style="padding-bottom:22px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#5B7A94;border-radius:11px;width:38px;height:38px;text-align:center;vertical-align:middle;font-size:19px;font-weight:600;color:#ffffff;line-height:38px;">s</td>
                <td style="padding-left:11px;font-size:17px;font-weight:600;color:#2A3644;letter-spacing:-0.2px;">samyest.mind</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Cartão -->
        <tr>
          <td style="background-color:#ffffff;border-radius:16px;padding:38px 34px;">

            <h1 style="margin:0 0 14px;font-size:21px;font-weight:600;color:#2A3644;letter-spacing:-0.3px;">Falta um passo</h1>

            <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:#3B4A5A;">
              Confirme seu email para ativar a conta e começar a organizar suas tarefas.
            </p>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#5B7A94;border-radius:10px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 30px;font-size:15px;font-weight:500;color:#ffffff;text-decoration:none;">Confirmar meu email</a>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 0;font-size:12.5px;line-height:1.6;color:#7D9AB3;">
              O botão não funcionou? <a href="{{ .ConfirmationURL }}" style="color:#5B7A94;">Use este link</a>.
            </p>

          </td>
        </tr>

        <!-- Rodapé -->
        <tr>
          <td align="center" style="padding-top:22px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#9AAFC2;">
              Não foi você que criou essa conta? É só ignorar este email.
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
